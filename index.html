<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON BREACH</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#090d13;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{display:block;width:100vw;height:100vh;outline:none}</style></head><body><canvas id="c" tabindex="0"></canvas><script>
"use strict";
const c=document.getElementById('c'),g=c.getContext('2d');let W=0,H=0,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);
const C={bg:'#090d13',floor:'#1b222c',lane:'#222d39',ink:'#070a0e',white:'#f6f8fb',muted:'#96a3b2',cyan:'#55d8d0',blue:'#5b9dff',red:'#f36565',green:'#6fd18a',yellow:'#f4ca58',wall:'#3b4757',hi:'#526176'};
const MAP={w:2200,h:2600},R=20,WALK=330,DASH=720,DASH_TIME=.38;
let walls=[],id=null,room=null,players=[],bullets=[],screen='home',connected=false,error='',ping=0,name='PLAYER'+Math.floor(Math.random()*900+100),code='',field=null,feed=[],endText='';
const me={x:1000,y:2200,a:0,hp:100,ammo:24,reserve:120,team:'blue',ready:false,dead:false,dashTime:0,dashX:0,dashY:0};
const remote=new Map(),cam={x:0,y:0};let seq=0,lastSend=0,dashLatch=false,shotCD=0;
const K=new Set(),M={x:0,y:0,down:false,click:false};
addEventListener('keydown',e=>{K.add(e.code);if(['KeyW','KeyA','KeyS','KeyD','Space','ShiftLeft','ShiftRight','KeyR','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(field){if(e.code==='Backspace'){if(field==='name')name=name.slice(0,-1);else code=code.slice(0,-1);e.preventDefault()}else if(e.code==='Enter')field=null;else if(e.key.length===1){if(field==='name'&&name.length<14)name+=e.key;if(field==='code'&&code.length<5)code+=(e.key.toUpperCase().match(/[A-Z0-9]/)||[''])[0]}}},{passive:false});
addEventListener('keyup',e=>K.delete(e.code));addEventListener('blur',()=>K.clear());c.onpointermove=e=>(M.x=e.clientX,M.y=e.clientY);c.onpointerdown=()=>{M.down=true;M.click=true;c.focus()};addEventListener('pointerup',()=>M.down=false);
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);function send(o){if(ws.readyState===1)ws.send(JSON.stringify(o))}ws.onopen=()=>connected=true;ws.onclose=()=>connected=false;
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='hello'){id=m.id;walls=m.walls||[]}if(m.type==='joined'){screen='lobby';error=''}if(m.type==='error')error=m.message;if(m.type==='pong')ping=Date.now()-m.ts;if(m.type==='event'){if(m.event==='kill'){feed.unshift({t:4,text:m.killer+'  ›  '+m.victim,team:m.team});if(feed.length>5)feed.pop()}if(m.event==='round_end')endText=m.winner==='draw'?'ROUND DRAW':m.winner.toUpperCase()+' WINS ROUND';if(m.event==='match_end')endText=m.winner.toUpperCase()+' WINS MATCH'}if(m.type==='state'){room=m.room;players=m.players;bullets=m.bullets||[];const s=players.find(p=>p.id===id);if(s){me.team=s.team;me.hp=s.hp;me.ammo=s.ammo;me.reserve=s.reserve;me.ready=s.ready;me.dead=s.dead;const err=Math.hypot(me.x-s.x,me.y-s.y);if(me.dead||err>120){me.x=s.x;me.y=s.y}else{me.x+=(s.x-me.x)*.10;me.y+=(s.y-me.y)*.10}}for(const p of players){if(p.id===id)continue;let r=remote.get(p.id);if(!r){r={x:p.x,y:p.y,tx:p.x,ty:p.y,a:p.a,ta:p.a};remote.set(p.id,r)}r.tx=p.x;r.ty=p.y;r.ta=p.a}for(const rid of [...remote.keys()])if(!players.some(p=>p.id===rid))remote.delete(rid);if(room?.phase==='playing')screen='game';else if(room?.phase==='lobby'&&screen!=='home')screen='lobby'}};
setInterval(()=>connected&&send({type:'ping',ts:Date.now()}),1000);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function rr(x,y,w,h,r,f,s=C.ink,l=3){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=f;g.fill();if(s){g.strokeStyle=s;g.lineWidth=l;g.stroke()}}function tx(t,x,y,s=16,col=C.white,al='left',wt=800){g.font=`${wt} ${s}px system-ui`;g.fillStyle=col;g.textAlign=al;g.textBaseline='middle';g.fillText(t,x,y)}function btn(t,x,y,w,h,fn,accent=false){const hot=M.x>x&&M.x<x+w&&M.y>y&&M.y<y+h;rr(x,y+(hot?2:0),w,h,12,accent?C.cyan:(hot?C.white:'#dfe7ef'));tx(t,x+w/2,y+h/2,16,C.ink,'center',900);if(hot&&M.click)fn()}function box(label,val,x,y,w,key){rr(x,y,w,48,10,field===key?'#192634':'#121a23',C.wall,2);tx(label,x,y-14,11,C.muted);tx(val,x+12,y+24,16);if(M.click&&M.x>x&&M.x<x+w&&M.y>y&&M.y<y+48)field=key}
function mirrored(){return me.team==='red'}function viewY(y){return mirrored()?MAP.h-y:y}function viewA(a){return mirrored()?-a:a}function canonicalY(y){return mirrored()?MAP.h-y:y}function viewWall(w){return mirrored()?{x:w.x,y:MAP.h-(w.y+w.h),w:w.w,h:w.h}:w}
function blocked(x,y){if(x<R||x>MAP.w-R||y<R||y>MAP.h-R)return true;for(const w of walls){const nx=clamp(x,w.x,w.x+w.w),ny=clamp(y,w.y,w.y+w.h),dx=x-nx,dy=y-ny;if(dx*dx+dy*dy<R*R)return true}return false}function moveLocal(vx,vy,dt){const mx=vx*dt,my=vy*dt,n=Math.max(1,Math.ceil(Math.max(Math.abs(mx),Math.abs(my))/5)),sx=mx/n,sy=my/n;for(let i=0;i<n;i++){if(!blocked(me.x+sx,me.y))me.x+=sx;if(!blocked(me.x,me.y+sy))me.y+=sy}}
function home(){g.fillStyle=C.bg;g.fillRect(0,0,W,H);tx('NEON',W*.28,H*.25,70,C.white,'center',900);tx('BREACH',W*.28,H*.35,70,C.cyan,'center',900);tx('ONLINE 4v4',W*.28,H*.43,17,C.muted,'center');const x=W*.28-145;box('NICKNAME',name,x,H*.51,290,'name');btn('CREATE ROOM',x,H*.62,290,52,()=>send({type:'create',name}),true);box('ROOM CODE',code,x,H*.74,180,'code');btn('JOIN',x+192,H*.74,98,48,()=>send({type:'join',name,code}));tx(connected?'ONLINE':'CONNECTING...',W-24,28,12,connected?C.green:C.yellow,'right');if(error)tx(error,W*.28,H*.86,14,C.red,'center')}
function lobby(){g.fillStyle=C.bg;g.fillRect(0,0,W,H);tx(`ROOM ${room?.code||''}`,W/2,48,28,C.yellow,'center',900);const B=players.filter(p=>p.team==='blue'),Rr=players.filter(p=>p.team==='red');rr(W*.08,H*.18,W*.36,H*.58,20,'#111923');rr(W*.56,H*.18,W*.36,H*.58,20,'#181418');tx('BLUE',W*.26,H*.24,22,C.cyan,'center');tx('RED',W*.74,H*.24,22,C.red,'center');[B,Rr].forEach((arr,t)=>arr.forEach((p,i)=>{let x=t?W*.59:W*.11,y=H*.31+i*58,w=W*.30;rr(x,y,w,44,9,p.id===id?'#24303d':'#171e28',null);tx(p.name,x+12,y+22,15);tx(p.ready?'READY':'WAIT',x+w-12,y+22,11,p.ready?C.green:C.muted,'right')}));btn('JOIN BLUE',W*.14,H*.81,180,48,()=>send({type:'team',team:'blue'}));btn(me.ready?'UNREADY':'READY',W/2-100,H*.81,200,48,()=>send({type:'ready',value:!me.ready}),true);btn('JOIN RED',W*.70,H*.81,180,48,()=>send({type:'team',team:'red'}));if(room?.phase==='countdown')tx(Math.max(1,Math.ceil(room.countdown)),W/2,H*.50,72,C.yellow,'center',900)}
function agent(x,y,col,a,label,hp){g.save();g.translate(x,y);g.rotate(a);g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(0,14,18,6,0,0,7);g.fill();g.fillStyle=col;g.strokeStyle=C.ink;g.lineWidth=4;g.beginPath();g.arc(0,0,18,0,7);g.fill();g.stroke();g.fillStyle=C.ink;g.fillRect(8,-5,25,10);g.fillStyle=C.white;g.fillRect(29,-3,8,6);g.restore();tx(label,x,y-29,11,C.white,'center',800);rr(x-20,y+27,40,5,3,'#151c25',null);rr(x-20,y+27,40*clamp(hp/100,0,1),5,3,col,null)}
function update(dt){if(!room||room.phase!=='playing')return;shotCD-=dt;feed.forEach(f=>f.t-=dt);feed=feed.filter(f=>f.t>0);for(const r of remote.values()){r.x+=(r.tx-r.x)*Math.min(1,dt*12);r.y+=(r.ty-r.y)*Math.min(1,dt*12);let da=((r.ta-r.a+Math.PI*3)%(Math.PI*2))-Math.PI;r.a+=da*Math.min(1,dt*14)}if(me.dead)return;let sx=(K.has('KeyD')||K.has('ArrowRight')?1:0)-(K.has('KeyA')||K.has('ArrowLeft')?1:0),sy=(K.has('KeyS')||K.has('ArrowDown')?1:0)-(K.has('KeyW')||K.has('ArrowUp')?1:0),l=Math.hypot(sx,sy)||1;sx/=l;sy/=l;const dx=sx,dy=mirrored()?-sy:sy;const mw=cam.x+M.x,mvy=cam.y+M.y;me.a=Math.atan2(canonicalY(mvy)-me.y,mw-me.x);let dash=false,down=K.has('Space')||K.has('ShiftLeft')||K.has('ShiftRight');if(down&&!dashLatch){dashLatch=true;dash=true;me.dashTime=DASH_TIME;let qx=dx,qy=dy;if(Math.hypot(qx,qy)<.01){qx=Math.cos(me.a);qy=Math.sin(me.a)}const ql=Math.hypot(qx,qy)||1;me.dashX=qx/ql;me.dashY=qy/ql}else if(!down)dashLatch=false;let vx,vy;if(me.dashTime>0){me.dashTime-=dt;vx=me.dashX*DASH;vy=me.dashY*DASH}else{vx=dx*WALK;vy=dy*WALK}moveLocal(vx,vy,dt);const now=performance.now();if(now-lastSend>30){lastSend=now;send({type:'input',seq:++seq,dx,dy,a:me.a,dash})}if(M.down&&shotCD<=0&&me.ammo>0){shotCD=.10;send({type:'shoot',a:me.a})}if(K.has('KeyR')){send({type:'reload'});K.delete('KeyR')}cam.x+=(clamp(me.x-W/2,0,MAP.w-W)-cam.x)*Math.min(1,dt*8);cam.y+=(clamp(viewY(me.y)-H/2,0,MAP.h-H)-cam.y)*Math.min(1,dt*8)}
function game(){g.fillStyle=C.bg;g.fillRect(0,0,W,H);g.save();g.translate(-cam.x,-cam.y);g.fillStyle=C.floor;g.fillRect(0,0,MAP.w,MAP.h);g.fillStyle='rgba(243,101,101,.07)';g.fillRect(0,0,MAP.w,980);g.fillStyle='rgba(85,216,208,.07)';g.fillRect(0,1620,MAP.w,980);g.fillStyle=C.lane;g.fillRect(0,1120,MAP.w,360);g.strokeStyle='#26313e';g.lineWidth=1;for(let x=0;x<MAP.w;x+=80){g.beginPath();g.moveTo(x,0);g.lineTo(x,MAP.h);g.stroke()}for(let y=0;y<MAP.h;y+=80){g.beginPath();g.moveTo(0,y);g.lineTo(MAP.w,y);g.stroke()}for(const w0 of walls){const w=viewWall(w0);rr(w.x,w.y,w.w,w.h,12,C.wall,C.ink,5);g.fillStyle=C.hi;g.fillRect(w.x+10,w.y+8,w.w-20,5)}tx('ENEMY SIDE',1100,110,25,C.red,'center',900);tx('YOUR SIDE',1100,2490,25,C.cyan,'center',900);for(const b of bullets){g.fillStyle=b.team===me.team?C.cyan:C.red;g.beginPath();g.arc(b.x,viewY(b.y),4,0,7);g.fill()}for(const p of players){if(p.dead)continue;if(p.id===id){agent(me.x,viewY(me.y),C.cyan,viewA(me.a),'YOU',me.hp);continue}const r=remote.get(p.id);if(!r)continue;agent(r.x,viewY(r.y),p.team===me.team?C.blue:C.red,viewA(r.a),p.name,p.hp)}g.restore();g.fillStyle='rgba(7,10,14,.95)';g.fillRect(0,0,W,84);tx('NEON BREACH',20,27,23,C.white);tx(`PING ${ping}ms`,20,54,11,ping<90?C.green:C.yellow);const ours=me.team==='blue'?room.blue:room.red,theirs=me.team==='blue'?room.red:room.blue,or=me.team==='blue'?room.blueRounds:room.redRounds,tr=me.team==='blue'?room.redRounds:room.blueRounds;tx(`${or} | ${ours}`,W/2-72,29,21,C.cyan,'center',900);tx('VS',W/2,29,13,C.white,'center');tx(`${theirs} | ${tr}`,W/2+72,29,21,C.red,'center',900);tx(`${Math.ceil(room.time)}s`,W/2,57,12,C.muted,'center');tx(`${me.hp} HP`,20,H-43,16,C.green);tx(`${me.ammo}/${me.reserve}`,W-20,H-43,26,C.white,'right',900);tx('WASD 이동 · 마우스 사격 · R 재장전 · SPACE/SHIFT 대시',W/2,H-17,12,C.muted,'center');let fy=108;for(const f of feed){tx(f.text,W-20,fy,13,f.team===me.team?C.cyan:C.red,'right',900);fy+=22}if(me.dead){g.fillStyle='rgba(0,0,0,.48)';g.fillRect(0,0,W,H);tx('RESPAWNING...',W/2,H/2,34,C.white,'center',900)}if(room.phase==='round_end'){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);tx(endText||'ROUND END',W/2,H/2,38,C.yellow,'center',900)}}
let last=performance.now();function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(screen==='game')update(dt);if(screen==='home')home();else if(screen==='lobby')lobby();else game();M.click=false;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
