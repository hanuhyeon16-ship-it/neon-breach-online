<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON BREACH</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#090d13;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{display:block;width:100vw;height:100vh;outline:none}
</style></head><body><canvas id="c" tabindex="0"></canvas><script>
const c=document.getElementById("c"),g=c.getContext("2d");let W,H,D=1;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}rs();onresize=rs;
const C={bg:"#090d13",floor:"#1b222c",lane:"#222d39",ink:"#070a0e",white:"#f6f8fb",muted:"#96a3b2",cyan:"#55d8d0",blue:"#5b9dff",red:"#f36565",green:"#6fd18a",yellow:"#f4ca58",wall:"#3b4757",hi:"#526176"};
let screen="home",id=null,room=null,players=[],shots=[],walls=[],connected=false,error="",name="PLAYER"+Math.floor(Math.random()*900+100),code="",field=null,ping=0;
let me={x:1000,y:2400,a:0,hp:100,ammo:24,team:"blue",ready:false,dead:false};let cam={x:0,y:0},K=new Set(),M={x:0,y:0,down:false,click:false},dash=0,fire=0;
addEventListener("keydown",e=>{K.add(e.code);if(field){if(e.code==="Backspace"){if(field==="name")name=name.slice(0,-1);else code=code.slice(0,-1);e.preventDefault()}else if(e.key.length===1){if(field==="name"&&name.length<14)name+=e.key;if(field==="code"&&code.length<5)code+=(e.key.toUpperCase().match(/[A-Z0-9]/)||[""])[0]}}});
addEventListener("keyup",e=>K.delete(e.code));c.onpointermove=e=>(M.x=e.clientX,M.y=e.clientY);c.onpointerdown=()=>{M.down=true;M.click=true;c.focus()};onpointerup=()=>M.down=false;
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
function send(o){if(ws.readyState===1)ws.send(JSON.stringify(o))}
ws.onopen=()=>connected=true;ws.onclose=()=>connected=false;
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="hello"){id=m.id;walls=m.walls||[]}if(m.type==="joined"){screen="lobby"}if(m.type==="error")error=m.message;
if(m.type==="state"){room=m.room;players=m.players;let p=players.find(x=>x.id===id);if(p){me={...me,...p};if(me.dead||Math.hypot(me.x-p.x,me.y-p.y)>180){me.x=p.x;me.y=p.y}}if(room?.phase==="playing")screen="game";if(room?.phase==="lobby"&&screen!=="home")screen="lobby"}
if(m.type==="shot")shots.push({x:m.x,y:m.y,a:m.a,team:m.team,owner:m.owner,l:.9});if(m.type==="pong")ping=Date.now()-m.ts};
setInterval(()=>connected&&send({type:"ping",ts:Date.now()}),1000);
function rr(x,y,w,h,r,f,s=C.ink,l=3){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=f;g.fill();if(s){g.strokeStyle=s;g.lineWidth=l;g.stroke()}}
function tx(t,x,y,s=16,col=C.white,al="left",wt=800){g.font=`${wt} ${s}px system-ui`;g.fillStyle=col;g.textAlign=al;g.textBaseline="middle";g.fillText(t,x,y)}
function btn(t,x,y,w,h,fn,a=false){let hvr=M.x>x&&M.x<x+w&&M.y>y&&M.y<y+h;rr(x,y+(hvr?2:0),w,h,12,a?C.cyan:(hvr?C.white:"#dfe7ef"));tx(t,x+w/2,y+h/2,16,C.ink,"center",900);if(hvr&&M.click)fn()}
function box(label,val,x,y,w,key){rr(x,y,w,48,10,field===key?"#192634":"#121a23",C.wall,2);tx(label,x,y-14,11,C.muted);tx(val,x+12,y+24,16);if(M.click&&M.x>x&&M.x<x+w&&M.y>y&&M.y<y+48)field=key}
function home(){g.fillStyle=C.bg;g.fillRect(0,0,W,H);tx("NEON",W*.28,H*.25,70,C.white,"center",900);tx("BREACH",W*.28,H*.35,70,C.cyan,"center",900);tx("ONLINE 4v4",W*.28,H*.43,17,C.muted,"center");let x=W*.28-145;box("NICKNAME",name,x,H*.51,290,"name");btn("CREATE ROOM",x,H*.62,290,52,()=>send({type:"create",name}),true);box("ROOM CODE",code,x,H*.74,180,"code");btn("JOIN",x+192,H*.74,98,48,()=>send({type:"join",name,code}));tx(connected?"ONLINE":"CONNECTING...",W-24,28,12,connected?C.green:C.yellow,"right");if(error)tx(error,W*.28,H*.86,14,C.red,"center")}
function lobby(){g.fillStyle=C.bg;g.fillRect(0,0,W,H);tx(`ROOM ${room?.code||""}`,W/2,48,28,C.yellow,"center",900);let B=players.filter(p=>p.team==="blue"),R=players.filter(p=>p.team==="red");rr(W*.08,H*.18,W*.36,H*.58,20,"#111923");rr(W*.56,H*.18,W*.36,H*.58,20,"#181418");tx("BLUE · BOTTOM",W*.26,H*.24,22,C.cyan,"center");tx("RED · TOP",W*.74,H*.24,22,C.red,"center");[B,R].forEach((a,t)=>a.forEach((p,i)=>{let x=t?W*.59:W*.11,y=H*.31+i*58,w=W*.30;rr(x,y,w,44,9,p.id===id?"#24303d":"#171e28",null);tx(p.name,x+12,y+22,15);tx(p.ready?"READY":"WAIT",x+w-12,y+22,11,p.ready?C.green:C.muted,"right")}));btn("JOIN BLUE",W*.14,H*.81,180,48,()=>send({type:"team",team:"blue"}));btn("READY",W/2-100,H*.81,200,48,()=>send({type:"ready",value:!me.ready}),true);btn("JOIN RED",W*.70,H*.81,180,48,()=>send({type:"team",team:"red"}));if(room?.phase==="countdown")tx(Math.ceil(room.countdown),W/2,H*.50,72,C.yellow,"center",900)}
function agent(x,y,col,a,label){g.save();g.translate(x,y);g.rotate(a);g.fillStyle=col;g.strokeStyle=C.ink;g.lineWidth=4;g.beginPath();g.arc(0,0,18,0,7);g.fill();g.stroke();g.fillStyle=C.ink;g.fillRect(8,-5,25,10);g.restore();tx(label,x,y-29,11,C.white,"center")}
function update(dt){if(!room||room.phase!=="playing"||me.dead)return;dash-=dt;fire-=dt;let dx=(K.has("KeyD")?1:0)-(K.has("KeyA")?1:0),dy=(K.has("KeyS")?1:0)-(K.has("KeyW")?1:0),d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;me.a=Math.atan2(cam.y+M.y-me.y,cam.x+M.x-me.x);let ds=false;if((K.has("Space")||K.has("ShiftLeft"))&&dash<=0){dash=1.1;ds=true}let sp=ds?820:330;me.x+=dx*sp*dt;me.y+=dy*sp*dt;send({type:"move",x:me.x,y:me.y,a:me.a,dash:ds});if(M.down&&fire<=0&&me.ammo>0){fire=.1;send({type:"shoot",a:me.a})}if(K.has("KeyR")){send({type:"reload"});K.delete("KeyR")}shots.forEach(s=>{s.x+=Math.cos(s.a)*950*dt;s.y+=Math.sin(s.a)*950*dt;s.l-=dt;if(s.owner!==id&&s.team!==me.team&&!me.dead&&Math.hypot(s.x-me.x,s.y-me.y)<23){s.l=0;send({type:"hit",target:id,damage:22})}});shots=shots.filter(s=>s.l>0);cam.x+=(Math.max(0,Math.min(2200-W,me.x-W/2))-cam.x)*Math.min(1,dt*7);cam.y+=(Math.max(0,Math.min(2600-H,me.y-H/2))-cam.y)*Math.min(1,dt*7)}
function game(){g.fillStyle=C.bg;g.fillRect(0,0,W,H);g.save();g.translate(-cam.x,-cam.y);g.fillStyle=C.floor;g.fillRect(0,0,2200,2600);g.fillStyle="rgba(243,101,101,.07)";g.fillRect(0,0,2200,980);g.fillStyle="rgba(85,216,208,.07)";g.fillRect(0,1620,2200,980);g.fillStyle=C.lane;g.fillRect(0,1120,2200,360);walls.forEach(w=>{rr(w.x,w.y,w.w,w.h,12,C.wall);g.fillStyle=C.hi;g.fillRect(w.x+10,w.y+8,w.w-20,5)});tx("RED ZONE",1100,115,26,C.red,"center");tx("BLUE ZONE",1100,2480,26,C.cyan,"center");shots.forEach(s=>{g.fillStyle=s.team==="blue"?C.cyan:C.red;g.beginPath();g.arc(s.x,s.y,4,0,7);g.fill()});players.forEach(p=>{if(p.dead)return;agent(p.id===id?me.x:p.x,p.id===id?me.y:p.y,p.team==="blue"?(p.id===id?C.cyan:C.blue):C.red,p.id===id?me.a:p.a,p.id===id?"YOU":p.name)});g.restore();g.fillStyle="#080c12";g.fillRect(0,0,W,82);tx(`${room.blueRounds} | ${room.blue}`,W/2-70,30,21,C.cyan,"center");tx("VS",W/2,30,13,C.white,"center");tx(`${room.red} | ${room.redRounds}`,W/2+70,30,21,C.red,"center");tx(`${Math.ceil(room.time)}s`,W/2,57,12,C.muted,"center");tx(`PING ${ping}ms`,20,30,12,ping<100?C.green:C.yellow);tx(`${me.hp} HP`,20,H-42,16,C.green);tx(`${me.ammo}/24`,W-20,H-42,26,C.white,"right");tx("WASD · 마우스 사격 · R 재장전 · SPACE 긴 대시",W/2,H-17,12,C.muted,"center");if(me.dead){g.fillStyle="rgba(0,0,0,.5)";g.fillRect(0,0,W,H);tx("RESPAWNING...",W/2,H/2,34,C.white,"center")}}
let last=performance.now();function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;if(screen==="game")update(dt);screen==="home"?home():screen==="lobby"?lobby():game();M.click=false;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
