</style></head><body><canvas id="c" tabindex="0"></canvas><script>
"use strict";
const c=document.getElementById('c'),g=c.getContext('2d');let W=0,H=0,D=1;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';g.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);

const C={bg:'#080b10',panel:'#111822',panel2:'#161f2a',floor:'#1b222c',floor2:'#202a36',grid:'#293541',ink:'#06080c',white:'#f4f7fb',muted:'#94a2b2',cyan:'#55d8d0',blue:'#5b9dff',red:'#f36565',green:'#70d38d',yellow:'#f4ca58',purple:'#a47be8',orange:'#f0a15a',wall:'#394657',hi:'#526176'};
const K=new Set(),M={x:0,y:0,down:false,click:false};
addEventListener('keydown',e=>{K.add(e.code);if(['KeyW','KeyA','KeyS','KeyD','Space','ShiftLeft','ShiftRight','KeyR','KeyQ','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();handleTyping(e)},{passive:false});
addEventListener('keyup',e=>K.delete(e.code));addEventListener('blur',()=>K.clear());c.addEventListener('pointermove',e=>{M.x=e.clientX;M.y=e.clientY});c.addEventListener('pointerdown',()=>{M.down=true;M.click=true;c.focus();unlockAudio()});addEventListener('pointerup',()=>M.down=false);

let version='V4.0',id=null,room=null,players=[],maps={},weapons={},agents={},modes={},screen='home',connected=false,error='',ping=0,field=null;
let name=localStorage.nb_name||('PLAYER'+Math.floor(Math.random()*900+100)),code='',token=localStorage.nb_token||crypto.randomUUID(),lastRoom=localStorage.nb_room||'';localStorage.nb_token=token;
let profile=JSON.parse(localStorage.nb_profile||'{"wins":0,"losses":0,"kills":0,"deaths":0,"rating":1000,"tier":"SILVER","matches":0}');
let selectedWeapon=localStorage.nb_weapon||'rifle',selectedAgent=localStorage.nb_agent||'blitz',soundOn=localStorage.nb_sound!=='0';
const me={x:1000,y:2200,drawX:1000,drawY:2200,a:0,hp:100,ammo:24,reserve:120,team:'blue',ready:false,dead:false,weapon:'rifle',agent:'blitz',dashCD:0,dashTime:0,dashX:0,dashY:0,overdrive:0,skillCD:0,reload:0};
let pending=[],seq=0,inputAcc=0,lastShot=0,lastSkill=false,dashLatch=false,snapshots=[],tracers=[],particles=[],casings=[],muzzles=[],feed=[],hitMarker=0,hitHead=false,endText='',recoil=0,screenShake=0,spectateIndex=0,scoreboard=false,toast='',toastT=0;
const cam={x:0,y:0};

const audioNames=['rifle','smg','shotgun','marksman','lmg','reload','dash','hit','headshot','kill','skill','round','victory'];const AUDIO={};let audioUnlocked=false;
for(const n of audioNames){AUDIO[n]=new Audio('/audio/'+n+'.wav');AUDIO[n].preload='auto'}
function unlockAudio(){if(audioUnlocked)return;audioUnlocked=true;try{const a=AUDIO.hit.cloneNode();a.volume=.001;a.play().catch(()=>{})}catch{}}
function sfx(n,vol=.35){if(!soundOn||!audioUnlocked||!AUDIO[n])return;try{const a=AUDIO[n].cloneNode();a.volume=vol;a.play().catch(()=>{})}catch{}}

const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
function send(o){if(ws.readyState===1)ws.send(JSON.stringify(o))}
ws.onopen=()=>{connected=true;if(lastRoom)send({type:'resume',token,code:lastRoom})};ws.onclose=()=>{connected=false;toast='CONNECTION LOST — reconnecting may take a moment';toastT=4};
ws.onmessage=e=>{const m=JSON.parse(e.data);
 if(m.type==='hello'){id=m.id;version=m.version||version;maps=m.maps||{};weapons=m.weapons||{};agents=m.agents||{};modes=m.modes||{}}
 if(m.type==='joined'){id=m.id;lastRoom=m.code;localStorage.nb_room=lastRoom;screen='lobby';error='';if(m.resumed){toast='RECONNECTED';toastT=2}}
 if(m.type==='resume_fail'){lastRoom='';localStorage.removeItem('nb_room')}
 if(m.type==='error'){error=m.message;toast=m.message;toastT=2.5}
 if(m.type==='pong'){ping=Date.now()-m.ts;send({type:'ping_report',ping})}
 if(m.type==='hitconfirm'){hitMarker=.16;hitHead=!!m.headshot;if(m.kill){sfx('kill',.42);screenShake=5}else sfx(m.headshot?'headshot':'hit',.3)}
 if(m.type==='shot'){receiveShot(m)}
 if(m.type==='event'){handleEvent(m)}
 if(m.type==='state')receiveState(m)
};
setInterval(()=>connected&&send({type:'ping',ts:Date.now()}),1000);

function handleEvent(m){
 if(m.event==='kill'){feed.unshift({text:m.killer+'  ›  '+m.victim,team:m.team,head:m.headshot,t:4});if(feed.length>6)feed.pop()}
 if(m.event==='round_start'){endText='';sfx('round',.38);toast=(modes[m.mode]?.name||m.mode)+' · '+(maps[m.map]?.name||m.map);toastT=2}
 if(m.event==='round_end'){endText=m.winner==='draw'?'ROUND DRAW':m.winner.toUpperCase()+' WINS ROUND'}
 if(m.event==='match_end'){endText=m.winner.toUpperCase()+' WINS MATCH';sfx('victory',.45)}
 if(m.event==='disconnected'){toast=m.name+' DISCONNECTED';toastT=2}
 if(m.event==='reconnected'){toast=m.name+' RECONNECTED';toastT=2}
 if(m.event==='afk_warning'){toast='AFK WARNING — move or you will spectate';toastT=4}
 if(m.event==='afk_spectate'){toast=m.name+' moved to spectator';toastT=3}
 if(m.event==='skill'||m.event==='skill_fx')sfx('skill',.30)
}
function receiveShot(m){for(const r of m.rays||[]){tracers.push({x1:r.x1,y1:r.y1,x2:r.x2,y2:r.y2,team:m.team,weapon:m.weapon,l:.11});for(let i=0;i<2;i++)particles.push({x:r.x2,y:r.y2,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,l:.18,col:r.head?C.yellow:C.white,size:2})}muzzles.push({x:m.rays?.[0]?.x1||0,y:m.rays?.[0]?.y1||0,team:m.team,l:.08});if(m.owner!==id){const p=players.find(q=>q.id===m.owner);if(p){const d=Math.hypot(p.x-me.x,p.y-me.y),vol=Math.max(.08,.36-d/2500);sfx(m.weapon,vol)}}}
function receiveState(m){version=m.version||version;room=m.room;players=m.players||[];const now=performance.now();snapshots.push({t:now,players:players.map(p=>({...p}))});while(snapshots.length>20)snapshots.shift();const s=players.find(p=>p.id===id);if(s){profile=s.profile||profile;localStorage.nb_profile=JSON.stringify(profile);selectedWeapon=s.weapon||selectedWeapon;selectedAgent=s.agent||selectedAgent;Object.assign(me,{hp:s.hp,ammo:s.ammo,reserve:s.reserve,team:s.team,ready:s.ready,dead:s.dead,weapon:s.weapon,agent:s.agent,skillCD:s.skillCD,reload:s.reload||0,dashCD:s.dashCD,dashTime:s.dashTime,dashX:s.dashX,dashY:s.dashY,overdrive:s.overdrive});reconcile(s)}if(room?.phase==='playing'||room?.phase==='round_end')screen='game';else if(room?.phase==='lobby'&&screen!=='home')screen='lobby'}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const lerp=(a,b,t)=>a+(b-a)*t;
function rr(x,y,w,h,r,f,s=C.ink,l=3){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=f;g.fill();if(s){g.strokeStyle=s;g.lineWidth=l;g.stroke()}}
function tx(t,x,y,s=16,col=C.white,al='left',wt=800){g.font=`${wt} ${s}px system-ui`;g.fillStyle=col;g.textAlign=al;g.textBaseline='middle';g.fillText(t,x,y)}
function btn(t,x,y,w,h,fn,accent=false,disabled=false){const hot=!disabled&&M.x>x&&M.x<x+w&&M.y>y&&M.y<y+h;rr(x,y+(hot?2:0),w,h,12,disabled?'#252b34':accent?C.cyan:(hot?C.white:'#dfe7ef'),C.ink,3);tx(t,x+w/2,y+h/2,15,disabled?C.muted:C.ink,'center',900);if(hot&&M.click)fn()}
function box(label,val,x,y,w,key){rr(x,y,w,48,10,field===key?'#192634':'#121a23',C.wall,2);tx(label,x,y-14,11,C.muted);tx(val,x+12,y+24,16);if(M.click&&M.x>x&&M.x<x+w&&M.y>y&&M.y<y+48)field=key}
function handleTyping(e){if(!field)return;if(e.code==='Backspace'){if(field==='name')name=name.slice(0,-1);else code=code.slice(0,-1);e.preventDefault();return}if(e.code==='Enter'){field=null;return}if(e.key.length===1){if(field==='name'&&name.length<14)name+=e.key;if(field==='code'&&code.length<5)code+=(e.key.toUpperCase().match(/[A-Z0-9]/)||[''])[0]}}
function tierColor(t){return t==='DIAMOND'?C.cyan:t==='PLATINUM'?C.purple:t==='GOLD'?C.yellow:t==='SILVER'?'#c7d0da':C.orange}

function mapDef(){return maps[room?.map]||maps.longyard||{w:2200,h:2600,walls:[],blue:[],red:[],control:{x:1100,y:1300,r:170}}}
function mirrored(){return me.team==='red'}function viewY(y){return mirrored()?mapDef().h-y:y}function canonicalY(y){return mirrored()?mapDef().h-y:y}function viewAngle(a){return mirrored()?-a:a}function viewWall(w){return mirrored()?{x:w.x,y:mapDef().h-w.y-w.h,w:w.w,h:w.h}:w}
function barrierRects(){return (roomStateBarriers||[]).map(b=>({x:b.x-b.w/2,y:b.y-b.h/2,w:b.w,h:b.h}))}
let roomStateBarriers=[],roomStateSmokes=[];
function blockedLocal(x,y){const m=mapDef();if(x<20||x>m.w-20||y<20||y>m.h-20)return true;for(const w of [...m.walls,...barrierRects()]){const nx=clamp(x,w.x,w.x+w.w),ny=clamp(y,w.y,w.y+w.h),dx=x-nx,dy=y-ny;if(dx*dx+dy*dy<400)return true}return false}
function moveSubLocal(st,vx,vy,dt){const mx=vx*dt,my=vy*dt,steps=Math.max(1,Math.ceil(Math.max(Math.abs(mx),Math.abs(my))/4)),sx=mx/steps,sy=my/steps;for(let i=0;i<steps;i++){if(!blockedLocal(st.x+sx,st.y))st.x+=sx;if(!blockedLocal(st.x,st.y+sy))st.y+=sy}}
function applyCommand(st,cmd,dt){st.dashCD=Math.max(0,(st.dashCD||0)-dt);st.overdrive=Math.max(0,(st.overdrive||0)-dt);if(cmd.dash&&st.dashCD<=0){let x=cmd.dx,y=cmd.dy;if(Math.hypot(x,y)<.01){x=Math.cos(cmd.a);y=Math.sin(cmd.a)}const l=Math.hypot(x,y)||1;st.dashX=x/l;st.dashY=y/l;st.dashTime=DASH_TIME;st.dashCD=1.05}sfxDashOnce(cmd);const mul=st.overdrive>0?1.15:1;let vx,vy;if(st.dashTime>0){st.dashTime=Math.max(0,st.dashTime-dt);vx=st.dashX*DASH_SPEED*mul;vy=st.dashY*DASH_SPEED*mul}else{vx=cmd.dx*330*mul;vy=cmd.dy*330*mul}moveSubLocal(st,vx,vy,dt)}
let lastDashSeq=-1;function sfxDashOnce(cmd){if(cmd.dash&&cmd.seq!==lastDashSeq){lastDashSeq=cmd.seq;sfx('dash',.26);for(let i=0;i<10;i++)particles.push({x:me.x,y:me.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,l:.3,col:C.cyan,size:3})}}
function reconcile(s){roomStateBarriers=roomStateBarriers||[];pending=pending.filter(q=>q.seq>s.ack);const st={x:s.x,y:s.y,dashCD:s.dashCD||0,dashTime:s.dashTime||0,dashX:s.dashX||0,dashY:s.dashY||0,overdrive:s.overdrive||0};for(const cmd of pending)applyCommand(st,cmd,1/60);const err=Math.hypot(me.x-st.x,me.y-st.y);if(err>180||me.dead){me.x=st.x;me.y=st.y;me.drawX=st.x;me.drawY=st.y}else{me.x=st.x;me.y=st.y}Object.assign(me,{dashCD:st.dashCD,dashTime:st.dashTime,dashX:st.dashX,dashY:st.dashY,overdrive:st.overdrive})}
function fixedInputTick(){if(!room||room.phase!=='playing'||me.dead||me.team==='spec')return;let sx=(K.has('KeyD')||K.has('ArrowRight')?1:0)-(K.has('KeyA')||K.has('ArrowLeft')?1:0),sy=(K.has('KeyS')||K.has('ArrowDown')?1:0)-(K.has('KeyW')||K.has('ArrowUp')?1:0),l=Math.hypot(sx,sy)||1;sx/=l;sy/=l;const dx=sx,dy=mirrored()?-sy:sy;const txc=cam.x+M.x,tyc=canonicalY(cam.y+M.y);me.a=Math.atan2(tyc-me.y,txc-me.x);const down=K.has('Space')||K.has('ShiftLeft')||K.has('ShiftRight');let dash=false;if(down&&!dashLatch){dash=true;dashLatch=true}else if(!down)dashLatch=false;const cmd={type:'input',seq:++seq,dx,dy,a:me.a,dash};pending.push(cmd);if(pending.length>120)pending.shift();applyCommand(me,cmd,1/60);send(cmd)}

function interpolatedPlayer(pid){if(snapshots.length<2)return players.find(p=>p.id===pid)||null;const target=performance.now()-105;let a=snapshots[0],b=snapshots[snapshots.length-1];for(let i=0;i<snapshots.length-1;i++){if(snapshots[i].t<=target&&snapshots[i+1].t>=target){a=snapshots[i];b=snapshots[i+1];break}}const pa=a.players.find(p=>p.id===pid),pb=b.players.find(p=>p.id===pid);if(!pa)return pb||null;if(!pb)return pa;const t=clamp((target-a.t)/Math.max(1,b.t-a.t),0,1),da=((pb.a-pa.a+Math.PI*3)%(Math.PI*2))-Math.PI;return{...pb,x:lerp(pa.x,pb.x,t),y:lerp(pa.y,pb.y,t),a:pa.a+da*t}}

function localShoot(){if(!room||room.phase!=='playing'||me.dead||me.team==='spec')return;const w=weapons[me.weapon];if(!w||me.ammo<=0)return;const now=performance.now();if(now-lastShot<w.fire*1000)return;lastShot=now;send({type:'shoot',a:me.a,ts:Date.now()});sfx(me.weapon,.42);recoil=Math.min(10,recoil+w.recoil*2.2);screenShake=Math.max(screenShake,w.recoil*1.25);me.ammo=Math.max(0,me.ammo-1);muzzles.push({x:me.x+Math.cos(me.a)*26,y:me.y+Math.sin(me.a)*26,team:me.team,l:.07});casings.push({x:me.x,y:me.y,vx:Math.cos(me.a+Math.PI/2)*(70+Math.random()*60),vy:Math.sin(me.a+Math.PI/2)*(70+Math.random()*60),l:.7});if(me.ammo===0)requestReload()}
function requestReload(){const w=weapons[me.weapon];if(!w||me.ammo>=w.mag||me.reserve<=0)return;send({type:'reload'});sfx('reload',.28)}
function useSkill(){if(!room||room.phase!=='playing'||me.dead||me.team==='spec'||me.skillCD>0)return;const x=cam.x+M.x,y=canonicalY(cam.y+M.y);send({type:'skill',x,y});sfx('skill',.3)}

function update(dt){inputAcc+=dt;while(inputAcc>=1/60){fixedInputTick();inputAcc-=1/60}if(M.down)localShoot();if(K.has('KeyR')){requestReload();K.delete('KeyR')}const q=K.has('KeyQ');if(q&&!lastSkill)useSkill();lastSkill=q;scoreboard=K.has('Tab');if(toastT>0)toastT-=dt;if(hitMarker>0)hitMarker-=dt;recoil=Math.max(0,recoil-dt*16);screenShake=Math.max(0,screenShake-dt*20);for(const a of [tracers,particles,casings,muzzles,feed])for(const o of a)o.l!==undefined&&(o.l-=dt);tracers=tracers.filter(o=>o.l>0);particles=particles.filter(o=>o.l>0);casings=casings.filter(o=>o.l>0);muzzles=muzzles.filter(o=>o.l>0);feed=feed.filter(o=>o.t>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.93;p.vy*=.93}for(const q of casings){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94}me.drawX+=(me.x-me.drawX)*Math.min(1,dt*20);me.drawY+=(me.y-me.drawY)*Math.min(1,dt*20);updateCamera(dt)}
function cameraTarget(){if(me.team==='spec'){const alive=players.filter(p=>p.team==='blue'||p.team==='red').filter(p=>!p.dead&&p.connected);if(alive.length){spectateIndex=(spectateIndex+alive.length)%alive.length;return interpolatedPlayer(alive[spectateIndex].id)||alive[0]}}if(me.dead&&room?.mode==='elim'){const mates=players.filter(p=>p.team===me.team&&!p.dead&&p.id!==id);if(mates.length)return interpolatedPlayer(mates[spectateIndex%mates.length].id)||mates[0]}return{x:me.drawX,y:me.drawY}}
function updateCamera(dt){if(!room)return;const m=mapDef(),t=cameraTarget(),vy=viewY(t.y);cam.x+=(clamp(t.x-W/2,0,Math.max(0,m.w-W))-cam.x)*Math.min(1,dt*7);cam.y+=(clamp(vy-H/2,0,Math.max(0,m.h-H))-cam.y)*Math.min(1,dt*7)}

function home(){g.fillStyle=C.bg;g.fillRect(0,0,W,H);for(let i=0;i<34;i++){g.fillStyle=i%3?'#101720':'#162331';g.fillRect((i*173)%W,(i*97)%H,3,3)}tx('NEON',W*.27,H*.22,72,C.white,'center',900);tx('BREACH',W*.27,H*.32,72,C.cyan,'center',900);tx('V4 · COMPETITIVE 2D SHOOTER',W*.27,H*.40,15,C.muted,'center');const x=W*.27-150;box('NICKNAME',name,x,H*.49,300,'name');btn('CREATE ROOM',x,H*.60,300,54,()=>{localStorage.nb_name=name;send({type:'create',name,token,weapon:selectedWeapon,agent:selectedAgent})},true);box('ROOM CODE',code,x,H*.72,184,'code');btn('JOIN',x+196,H*.72,104,48,()=>{localStorage.nb_name=name;send({type:'join',name,code,token,weapon:selectedWeapon,agent:selectedAgent})});btn(soundOn?'SOUND ON':'SOUND OFF',x,H*.82,140,42,()=>{soundOn=!soundOn;localStorage.nb_sound=soundOn?'1':'0'});rr(W*.58,H*.25,W*.30,H*.45,24,C.panel,C.wall,3);tx('PROFILE',W*.61,H*.30,14,C.muted);tx(profile.tier,W*.61,H*.36,31,tierColor(profile.tier));tx(String(profile.rating),W*.84,H*.36,26,C.white,'right');tx(`W ${profile.wins}   L ${profile.losses}`,W*.61,H*.44,16,C.white);tx(`K ${profile.kills}   D ${profile.deaths}`,W*.61,H*.49,16,C.white);const kd=profile.deaths?profile.kills/profile.deaths:profile.kills;tx(`K/D ${kd.toFixed(2)}`,W*.61,H*.54,16,C.white);tx(`MATCHES ${profile.matches}`,W*.61,H*.59,13,C.muted);tx(connected?'SERVER ONLINE':'CONNECTING...',W-24,28,11,connected?C.green:C.yellow,'right',900);tx(version,W-24,48,10,C.muted,'right');if(error)tx(error,W*.27,H*.91,14,C.red,'center')}
function cycle(list,current,dir){const a=Object.keys(list),i=Math.max(0,a.indexOf(current));return a[(i+dir+a.length)%a.length]}
function lobby(){g.fillStyle=C.bg;g.fillRect(0,0,W,H);tx(`ROOM ${room?.code||''}`,W/2,34,26,C.yellow,'center',900);tx('share this code with friends',W/2,58,11,C.muted,'center');const B=players.filter(p=>p.team==='blue'),Rr=players.filter(p=>p.team==='red'),S=players.filter(p=>p.team==='spec');rr(30,92,W*.28,H*.55,20,'#101924',C.wall);rr(W-W*.28-30,92,W*.28,H*.55,20,'#191317',C.wall);tx('BLUE · YOUR SIDE',30+W*.14,126,19,C.cyan,'center');tx('RED · YOUR SIDE',W-W*.14-30,126,19,C.red,'center');[B,Rr].forEach((arr,t)=>arr.forEach((p,i)=>{const x=t?W-W*.28-10:50,y=160+i*54,w=W*.28-40;rr(x,y,w,42,9,p.id===id?'#253242':'#18212b',null);tx(p.name,x+12,y+21,14,C.white);tx(p.ready?'READY':'WAIT',x+w-12,y+21,10,p.ready?C.green:C.muted,'right')}));const midX=W*.34,midW=W*.32;rr(midX,92,midW,H*.55,20,C.panel,C.wall);tx('MATCH SETUP',W/2,126,17,C.white,'center');const host=room?.host===id;tx('MAP',midX+24,174,11,C.muted);tx(maps[room?.map]?.name||room?.map, W/2,174,16,C.white,'center');btn('‹',midX+22,194,46,38,()=>host&&send({type:'select_map',map:cycle(maps,room.map,-1)}),false,!host);btn('›',midX+midW-68,194,46,38,()=>host&&send({type:'select_map',map:cycle(maps,room.map,1)}),false,!host);tx('MODE',midX+24,256,11,C.muted);tx(modes[room?.mode]?.name||room?.mode,W/2,256,16,C.white,'center');btn('‹',midX+22,276,46,38,()=>host&&send({type:'select_mode',mode:cycle(modes,room.mode,-1)}),false,!host);btn('›',midX+midW-68,276,46,38,()=>host&&send({type:'select_mode',mode:cycle(modes,room.mode,1)}),false,!host);

 btn('JOIN BLUE',55,H*.70,180,46,()=>send({type:'team',team:'blue'}));btn(me.ready?'UNREADY':'READY',W/2-105,H*.70,210,48,()=>send({type:'ready',value:!me.ready}),true,me.team==='spec');btn('JOIN RED',W-235,H*.70,180,46,()=>send({type:'team',team:'red'}));btn('SPECTATE',W/2-90,H*.78,180,40,()=>send({type:'team',team:'spec'}));if(host)btn('HOST START',W/2-100,H*.86,200,44,()=>send({type:'start'}));if(S.length)tx(`SPECTATORS ${S.map(p=>p.name).join(', ')}`,W/2,H*.94,11,C.muted,'center');if(room?.phase==='countdown')tx(Math.max(1,Math.ceil(room.countdown)),W/2,H*.52,72,C.yellow,'center',900)}

function drawAgent(x,y,p,a,label,hp,alpha=1){g.save();g.globalAlpha=alpha;g.translate(x,y);g.rotate(a);const teamCol=p.team===me.team?C.blue:C.red,body=p.id===id?C.cyan:teamCol;const bob=Math.sin(performance.now()*.012+x*.02)*1.5;g.fillStyle='rgba(0,0,0,.30)';g.beginPath();g.ellipse(0,16,19,7,0,0,7);g.fill();g.strokeStyle=C.ink;g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(-8,11);g.lineTo(-10,24+bob);g.moveTo(8,11);g.lineTo(10,24-bob);g.stroke();g.fillStyle=body;g.beginPath();g.moveTo(-19,7);g.quadraticCurveTo(-23,-17,-6,-25);g.quadraticCurveTo(14,-30,22,-10);g.quadraticCurveTo(25,15,7,20);g.quadraticCurveTo(-14,24,-19,7);g.fill();g.stroke();g.fillStyle=C.ink;g.beginPath();g.arc(-6,-6,2.5,0,7);g.arc(6,-6,2.5,0,7);g.fill();drawGun(p.weapon||'rifle');if(p.scan&&p.team!==me.team){g.strokeStyle=C.yellow;g.lineWidth=3;g.beginPath();g.arc(0,0,27,0,7);g.stroke()}g.restore();g.globalAlpha=alpha;tx(label,x,y-31,10,C.white,'center',800);rr(x-20,y+27,40,5,3,'#151c25',null);rr(x-20,y+27,40*clamp(hp/100,0,1),5,3,body,null);g.globalAlpha=1}
function drawGun(w){g.fillStyle=C.ink;if(w==='smg'){g.fillRect(8,-4,23,8);g.fillRect(16,4,6,8)}else if(w==='shotgun'){g.fillRect(8,-5,34,10);g.fillStyle=C.orange;g.fillRect(17,-3,15,6)}else if(w==='marksman'){g.fillRect(8,-4,43,8);g.fillStyle=C.yellow;g.fillRect(17,-7,12,4)}else if(w==='lmg'){g.fillRect(7,-6,38,12);g.fillStyle=C.yellow;g.fillRect(13,6,13,8)}else{g.fillRect(8,-5,32,10);g.fillRect(18,5,6,7)}}
function inSmoke(p){for(const s of roomStateSmokes)if(Math.hypot(p.x-s.x,p.y-s.y)<s.r-12)return true;return false}

function game(){roomStateBarriers=(window._barriers||roomStateBarriers);roomStateSmokes=(window._smokes||roomStateSmokes);const sx=screenShake?(Math.random()-.5)*screenShake:0,sy=screenShake?(Math.random()-.5)*screenShake:0;g.fillStyle=C.bg;g.fillRect(0,0,W,H);g.save();g.translate(-cam.x+sx,-cam.y+sy);drawMap();for(const t of tracers){g.globalAlpha=clamp(t.l/.11,0,1);g.strokeStyle=t.team===me.team?C.cyan:C.red;g.lineWidth=t.weapon==='shotgun'?2:3;g.beginPath();g.moveTo(t.x1,viewY(t.y1));g.lineTo(t.x2,viewY(t.y2));g.stroke()}g.globalAlpha=1;for(const s of roomStateSmokes){const y=viewY(s.y),grad=g.createRadialGradient(s.x,y,20,s.x,y,s.r);grad.addColorStop(0,'rgba(38,43,52,.95)');grad.addColorStop(1,'rgba(25,29,36,.18)');g.fillStyle=grad;g.beginPath();g.arc(s.x,y,s.r,0,7);g.fill()}for(const p of players){if(p.dead||p.team==='spec')continue;let q=p.id===id?{...p,x:me.drawX,y:me.drawY,a:me.a}:interpolatedPlayer(p.id);if(!q)continue;let alpha=1;if(p.team!==me.team&&inSmoke(q)&&!p.scan)alpha=.12;drawAgent(q.x,viewY(q.y),p,viewAngle(q.a),p.id===id?'YOU':p.name,p.hp,alpha)}for(const m of muzzles){g.globalAlpha=clamp(m.l/.07,0,1);g.fillStyle=C.yellow;g.beginPath();g.arc(m.x,viewY(m.y),10,0,7);g.fill()}for(const p of particles){g.globalAlpha=clamp(p.l/.3,0,1);g.fillStyle=p.col;g.fillRect(p.x,viewY(p.y),p.size,p.size)}for(const q of casings){g.globalAlpha=clamp(q.l/.7,0,1);g.fillStyle=C.yellow;g.fillRect(q.x,viewY(q.y),4,2)}g.globalAlpha=1;g.restore();drawHUD();if(scoreboard)drawScoreboard()}
function drawHUD(){g.fillStyle='rgba(6,9,13,.95)';g.fillRect(0,0,W,86);tx('NEON BREACH',20,25,22,C.white);tx('V4 · RECONCILIATION + REWIND HITSCAN',20,51,9,C.yellow);tx(`PING ${ping}ms`,20,69,10,ping<85?C.green:ping<150?C.yellow:C.red);const us=me.team==='red'?room.red:room.blue,them=me.team==='red'?room.blue:room.red,ur=me.team==='red'?room.redRounds:room.blueRounds,tr=me.team==='red'?room.blueRounds:room.redRounds;tx(`${ur} | ${us}`,W/2-76,28,21,C.cyan,'center',900);tx('VS',W/2,28,12,C.white,'center');tx(`${them} | ${tr}`,W/2+76,28,21,C.red,'center',900);tx(`${modes[room.mode]?.name||room.mode} · ${Math.ceil(room.time)}s`,W/2,58,11,C.muted,'center');if(room.mode==='control'){tx(`CONTROL ${Math.floor(me.team==='red'?room.controlRed:room.controlBlue)} / ${modes.control.target}`,W/2,75,10,C.yellow,'center')}

function drawCrosshair(){const move=(K.has('KeyW')||K.has('KeyA')||K.has('KeyS')||K.has('KeyD'))?6:0,sp=8+move+recoil;g.strokeStyle=hitMarker>0?(hitHead?C.yellow:C.white):C.cyan;g.lineWidth=2;g.beginPath();g.moveTo(M.x-sp-7,M.y);g.lineTo(M.x-sp,M.y);g.moveTo(M.x+sp,M.y);g.lineTo(M.x+sp+7,M.y);g.moveTo(M.x,M.y-sp-7);g.lineTo(M.x,M.y-sp);g.moveTo(M.x,M.y+sp);g.lineTo(M.x,M.y+sp+7);g.stroke();if(hitMarker>0){g.beginPath();g.moveTo(M.x-7,M.y-7);g.lineTo(M.x+7,M.y+7);g.moveTo(M.x+7,M.y-7);g.lineTo(M.x-7,M.y+7);g.stroke()}}

let last=performance.now();function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(room){const latest=window.__latestState;if(latest){roomStateBarriers=latest.barriers||[];roomStateSmokes=latest.smokes||[]}}if(screen==='game')update(dt);if(screen==='home')home();else if(screen==='lobby')lobby();else game();M.click=false;requestAnimationFrame(loop)}
